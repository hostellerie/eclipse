name: One-shot admin list container queries
on:
  push:
    branches: [develop-1.1.0]
    paths: ['.github/workflows/one-shot-admin-list-container.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: develop-1.1.0
      - name: Move admin list responsive rules to admin layer
        shell: python
        run: |
          from pathlib import Path
          import re

          responsive = Path('eclipse/css/responsive.css')
          text = responsive.read_text(encoding='utf-8')
          text, count = re.subn(
              r'body\.eclipse-admin-page \.admin-list-search\{.*?(?=@media \(prefers-reduced-motion:reduce\))',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Expected admin-list-search block not found in responsive.css')
          responsive.write_text(text, encoding='utf-8')

          admin = Path('eclipse/css/admin/admin.css')
          text = admin.read_text(encoding='utf-8')
          old = 'body.eclipse-admin-page #centerblocks{min-width:0}'
          new = '''body.eclipse-admin-page #centerblocks{min-width:0;container-type:inline-size;container-name:eclipse-admin-content}\n\n/* Admin list filters respond to the width of the administration content, not the viewport. */\nbody.eclipse-admin-page .admin-list-search{display:grid;grid-template-columns:minmax(18rem,2fr) minmax(12rem,1.2fr) minmax(16rem,1.5fr) max-content;align-items:center;gap:.75rem 1rem;width:100%;max-width:100%;box-sizing:border-box}\nbody.eclipse-admin-page .admin-list-search .search-part{display:flex;flex-wrap:wrap;align-items:center;gap:.4rem .55rem;min-width:0;max-width:100%}\nbody.eclipse-admin-page .admin-list-search .search-part label{display:inline-flex;flex-wrap:wrap;align-items:center;gap:.35rem;min-width:0;margin:0}\nbody.eclipse-admin-page .admin-list-search input[type=text],body.eclipse-admin-page .admin-list-search input[type=search],body.eclipse-admin-page .admin-list-search select{min-width:0;max-width:100%}\nbody.eclipse-admin-page .admin-list-search input[type=text],body.eclipse-admin-page .admin-list-search input[type=search]{flex:1 1 10rem;width:auto}\nbody.eclipse-admin-page .admin-list-search select{flex:0 1 auto}\n@container eclipse-admin-content (max-width:58rem){\n  body.eclipse-admin-page .admin-list-search{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}\n  body.eclipse-admin-page .admin-list-search .search-part{width:100%}\n}\n@container eclipse-admin-content (max-width:38rem){\n  body.eclipse-admin-page .admin-list-search{grid-template-columns:minmax(0,1fr);align-items:stretch;gap:.65rem}\n}\n@container eclipse-admin-content (max-width:28rem){\n  body.eclipse-admin-page .admin-list-search .search-part,body.eclipse-admin-page .admin-list-search .search-part label{align-items:stretch}\n  body.eclipse-admin-page .admin-list-search .search-part{display:grid;grid-template-columns:minmax(0,1fr);gap:.45rem}\n  body.eclipse-admin-page .admin-list-search .search-part label{display:flex}\n  body.eclipse-admin-page .admin-list-search input[type=text],body.eclipse-admin-page .admin-list-search input[type=search],body.eclipse-admin-page .admin-list-search select,body.eclipse-admin-page .admin-list-search button{width:100%;max-width:100%}\n}'''
          if old not in text:
              raise SystemExit('centerblocks anchor not found in admin.css')
          text = text.replace(old, new, 1)
          admin.write_text(text, encoding='utf-8')

          Path('.github/workflows/one-shot-admin-list-container.yml').unlink()
      - name: Commit source refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add eclipse/css/responsive.css eclipse/css/admin/admin.css .github/workflows/one-shot-admin-list-container.yml
          git commit -m "Make admin list filters container responsive"
          git push
