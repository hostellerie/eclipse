name: Validate Eclipse pull request

on:
  pull_request:
    branches:
      - main
    paths:
      - 'eclipse/**'
      - 'quality/**'
      - '.github/workflows/validate-pr.yml'
      - 'RELEASE-NOTES.md'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Rebuild integrity manifest
        shell: pwsh
        run: ./quality/build-eclipse-manifest.ps1 -ThemePath ./eclipse

      - name: Verify manifest is committed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- eclipse/MANIFEST.json; then
            echo 'eclipse/MANIFEST.json is not synchronized with the theme tree.' >&2
            exit 1
          fi

      - name: Validate Eclipse 1.2 release contracts
        shell: pwsh
        run: ./quality/validate-eclipse-release.ps1 -ParentThemePath ./quality/fixtures/denim -NodePath (Get-Command node).Source

      - name: Build runtime package
        shell: bash
        run: |
          set -euo pipefail
          python3 ./quality/prepare-eclipse-package.py
          version=$(awk -F '"' '/^version = / { print $2; exit }' eclipse/theme.ini)
          test -n "$version"
          test "$version" = '1.2.0'
          test -d .package-stage/eclipse
          test ! -e .package-stage/eclipse/QA-CHECKLIST.md
          test ! -e .package-stage/eclipse/COMPATIBILITY.md

      - name: Verify install archive size
        shell: bash
        run: |
          set -euo pipefail
          version=$(awk -F '"' '/^version = / { print $2; exit }' eclipse/theme.ini)
          test -f .package-stage/ECLIPSE_THEME_PACKAGE
          (
            cd .package-stage
            zip -9 "../eclipse-$version.zip" ECLIPSE_THEME_PACKAGE
            zip -r -9 "../eclipse-$version.zip" eclipse -x '*/.DS_Store' '*/Thumbs.db'
          )
          first_entry=$(unzip -Z1 "eclipse-$version.zip" | head -n 1)
          test "$first_entry" = "ECLIPSE_THEME_PACKAGE"
          size=$(stat -c '%s' "eclipse-$version.zip")
          echo "Archive size: $size bytes"
          if [ "$size" -ge 1900000 ]; then
            echo 'Install archive is too large; expected < 1,900,000 bytes.' >&2
            exit 1
          fi
