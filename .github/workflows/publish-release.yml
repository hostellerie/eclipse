name: Publish Eclipse stable release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify tag matches theme version
        shell: bash
        run: |
          set -euo pipefail
          tag_version="${GITHUB_REF_NAME#v}"
          theme_version=$(awk -F '"' '/^version = / { print $2; exit }' eclipse/theme.ini)
          if [ -z "$theme_version" ] || [ "$tag_version" != "$theme_version" ]; then
            echo "Tag version $tag_version does not match eclipse/theme.ini version $theme_version" >&2
            exit 1
          fi

      - name: Rebuild integrity manifest
        shell: pwsh
        run: ./quality/build-eclipse-manifest.ps1 -ThemePath ./eclipse

      - name: Verify manifest is committed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- eclipse/MANIFEST.json; then
            echo 'eclipse/MANIFEST.json is not synchronized with the tagged theme tree.' >&2
            exit 1
          fi

      - name: Validate installable theme
        shell: pwsh
        run: ./quality/validate-eclipse.ps1 -ParentThemePath ./quality/fixtures/denim -NodePath (Get-Command node).Source

      - name: Build runtime release archive
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 ./quality/prepare-eclipse-package.py
          pwsh ./quality/build-eclipse-manifest.ps1 -ThemePath ./.package-stage/eclipse
          (
            cd .package-stage
            zip -r -9 "../eclipse-$version.zip" eclipse -x '*/.DS_Store' '*/Thumbs.db'
          )
          size=$(stat -c '%s' "eclipse-$version.zip")
          echo "Archive size: $size bytes"
          if [ "$size" -ge 1900000 ]; then
            echo 'Install archive is too large; expected < 1,900,000 bytes.' >&2
            exit 1
          fi
          sha256sum "eclipse-$version.zip" > "eclipse-$version.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "eclipse-$version.zip" \
            "eclipse-$version.zip.sha256" \
            --title "Eclipse $version" \
            --notes-file RELEASE-NOTES.md \
            --verify-tag
