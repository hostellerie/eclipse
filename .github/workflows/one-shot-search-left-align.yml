name: One-shot left-align admin search row

on:
  push:
    branches:
      - develop-1.1.0
    paths:
      - '.github/workflows/one-shot-search-left-align.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop-1.1.0
          fetch-depth: 0

      - name: Refine search row alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('eclipse/css/admin/admin.css')
          text = path.read_text()
          text = text.replace(
            'body.eclipse-admin-page .eclipse-admin-list-search-main{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:5.25rem minmax(0,1fr);align-items:center;gap:.65rem;min-width:0;width:100%}',
            'body.eclipse-admin-page .eclipse-admin-list-search-main{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:max-content minmax(0,1fr);align-items:center;justify-self:stretch;gap:.7rem;min-width:0;width:100%;text-align:left}'
          )
          text = text.replace(
            'body.eclipse-admin-page .eclipse-admin-list-search-label,body.eclipse-admin-page .eclipse-admin-list-filter-primary label,body.eclipse-admin-page .eclipse-admin-list-filter-limit{margin:0;color:var(--eclipse-admin-text);font-size:.78rem;font-weight:700;line-height:1.25}',
            'body.eclipse-admin-page .eclipse-admin-list-search-label{margin:0;color:var(--eclipse-admin-text);font-size:.9rem;font-weight:800;line-height:1.2;text-align:left}\\nbody.eclipse-admin-page .eclipse-admin-list-filter-primary label,body.eclipse-admin-page .eclipse-admin-list-filter-limit{margin:0;color:var(--eclipse-admin-text);font-size:.78rem;font-weight:700;line-height:1.25}'
          )
          text = text.replace(
            'body.eclipse-admin-page .eclipse-admin-list-search-main{grid-template-columns:4.75rem minmax(0,1fr)}',
            'body.eclipse-admin-page .eclipse-admin-list-search-main{grid-template-columns:max-content minmax(0,1fr)}'
          )
          path.write_text(text)
          PY

      - name: Commit alignment and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-search-left-align.yml
          git add eclipse/css/admin/admin.css
          git commit -m "Left-align and emphasize admin search row"
          git pull --rebase origin develop-1.1.0
          git push origin develop-1.1.0
