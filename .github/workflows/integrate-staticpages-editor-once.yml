name: Integrate Static Pages editor once

on:
  push:
    branches:
      - develop-1.1.0
    paths:
      - '.github/workflows/integrate-staticpages-editor-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop-1.1.0
          fetch-depth: 0
      - name: Integrate Static Pages editor enhancements
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/integrate-staticpages-editor.py
          rm -f .github/scripts/integrate-staticpages-editor.py
          rm -f .github/workflows/integrate-staticpages-editor-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Optimize Static Pages editor for writers"
          for attempt in 1 2 3; do
            if git push origin HEAD:develop-1.1.0; then exit 0; fi
            git fetch origin develop-1.1.0
            git rebase origin/develop-1.1.0
          done
          exit 1
