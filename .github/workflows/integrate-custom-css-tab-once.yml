name: Integrate Custom CSS tab once

on:
  push:
    branches:
      - develop-1.1.0
    paths:
      - '.github/workflows/integrate-custom-css-tab-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop-1.1.0
          fetch-depth: 0

      - name: Integrate Custom CSS directly into Theme Studio
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/integrate-custom-css-tab.py
          rm -f eclipse/js/custom-css.js
          rm -f .github/scripts/integrate-custom-css-tab.py
          rm -f .github/workflows/integrate-custom-css-tab-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Custom CSS directly into Theme Studio"
          for attempt in 1 2 3; do
            if git push origin HEAD:develop-1.1.0; then
              exit 0
            fi
            git fetch origin develop-1.1.0
            git rebase origin/develop-1.1.0
          done
          exit 1
