name: Integrate Custom CSS tab once

on:
  push:
    branches:
      - develop-1.1.0
    paths:
      - '.github/workflows/integrate-custom-css-tab-once.yml'

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop-1.1.0
          fetch-depth: 0

      - name: Integrate Custom CSS directly into Theme Studio
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          functions = Path('eclipse/functions.php')
          text = functions.read_text()

          old = "    $token = function_exists('SEC_createToken') ? SEC_createToken() : '';\n    $h = function ($value) { return htmlspecialchars((string) $value, ENT_QUOTES, 'UTF-8'); };\n    $environmentGeeklog = defined('VERSION') ? VERSION : '2.1.1 reference';"
          new = "    $token = function_exists('SEC_createToken') ? SEC_createToken() : '';\n    $h = function ($value) { return htmlspecialchars((string) $value, ENT_QUOTES, 'UTF-8'); };\n    $customCss = function_exists('eclipse_custom_css_read') ? eclipse_custom_css_read() : '';\n    $customCssNotice = function_exists('eclipse_custom_css_notice') ? eclipse_custom_css_notice() : array();\n    $customCssFr = strpos(strtolower((string) eclipse_html_language()), 'fr') === 0;\n    $environmentGeeklog = defined('VERSION') ? VERSION : '2.1.1 reference';"
          if old not in text:
              raise SystemExit('Unable to locate Theme Studio setup insertion point')
          text = text.replace(old, new, 1)

          old = "    $html .= '<nav class=\"eclipse-studio-tabs\" role=\"tablist\" aria-label=\"Theme Studio sections\"><button type=\"button\" role=\"tab\" id=\"eclipse-tab-design\" aria-controls=\"eclipse-panel-design\" aria-selected=\"true\">Design</button><button type=\"button\" role=\"tab\" id=\"eclipse-tab-preview\" aria-controls=\"eclipse-panel-preview\" aria-selected=\"false\" tabindex=\"-1\">Preview</button><button type=\"button\" role=\"tab\" id=\"eclipse-tab-updates\" aria-controls=\"eclipse-panel-updates\" aria-selected=\"false\" tabindex=\"-1\">Updates</button><button type=\"button\" role=\"tab\" id=\"eclipse-tab-documentation\" aria-controls=\"eclipse-panel-documentation\" aria-selected=\"false\" tabindex=\"-1\">Documentation</button></nav>';"
          new = "    $html .= '<nav class=\"eclipse-studio-tabs\" role=\"tablist\" aria-label=\"Theme Studio sections\"><button type=\"button\" role=\"tab\" id=\"eclipse-tab-design\" aria-controls=\"eclipse-panel-design\" aria-selected=\"true\">Design</button><button type=\"button\" role=\"tab\" id=\"eclipse-tab-preview\" aria-controls=\"eclipse-panel-preview\" aria-selected=\"false\" tabindex=\"-1\">Preview</button><button type=\"button\" role=\"tab\" id=\"eclipse-tab-css\" aria-controls=\"eclipse-panel-css\" aria-selected=\"false\" tabindex=\"-1\">CSS</button><button type=\"button\" role=\"tab\" id=\"eclipse-tab-updates\" aria-controls=\"eclipse-panel-updates\" aria-selected=\"false\" tabindex=\"-1\">Updates</button><button type=\"button\" role=\"tab\" id=\"eclipse-tab-documentation\" aria-controls=\"eclipse-panel-documentation\" aria-selected=\"false\" tabindex=\"-1\">Documentation</button></nav>';"
          if old not in text:
              raise SystemExit('Unable to locate Theme Studio tabs')
          text = text.replace(old, new, 1)

          marker = "    $html .= '<section id=\"eclipse-panel-updates\" class=\"eclipse-studio-panel\" role=\"tabpanel\" aria-labelledby=\"eclipse-tab-updates\" hidden>"
          if marker not in text:
              raise SystemExit('Unable to locate Updates panel')

          panel = r'''    $customCssNoticeHtml = '';
    if (!empty($customCssNotice['message'])) {
        $customCssNoticeHtml = '<p class="eclipse-notice ' . (!empty($customCssNotice['type']) && $customCssNotice['type'] === 'success' ? 'eclipse-success' : 'eclipse-error') . '" role="status">' . $h($customCssNotice['message']) . '</p>';
    }
    $customCssEyebrow = $customCssFr ? 'Personnalisation avancée' : 'Advanced customization';
    $customCssTitle = $customCssFr ? 'CSS personnalisé' : 'Custom CSS';
    $customCssIntro = $customCssFr
        ? 'Ajoutez ici des règles propres à ce site. Elles sont stockées hors du thème, survivent aux mises à jour d’Eclipse et sont chargées après les styles publics du thème.'
        : 'Add site-specific rules here. They are stored outside the theme, survive Eclipse updates and load after the public theme styles.';
    $customCssLabel = $customCssFr ? 'Feuille CSS du site' : 'Site CSS';
    $customCssHelp = $customCssFr
        ? 'Limite : 64 Kio. Le CSS est appliqué aux pages publiques uniquement. La séquence <code>&lt;/style&gt;</code> est refusée pour éviter de sortir du bloc CSS.'
        : 'Limit: 64 KiB. CSS is applied to public pages only. The <code>&lt;/style&gt;</code> sequence is rejected to prevent leaving the CSS block.';
    $customCssSave = $customCssFr ? 'Enregistrer le CSS' : 'Save CSS';
    $customCssClear = $customCssFr ? 'Vider le CSS' : 'Clear CSS';
    $html .= '<section id="eclipse-panel-css" class="eclipse-studio-panel eclipse-custom-css-panel" role="tabpanel" aria-labelledby="eclipse-tab-css" hidden><form method="post" action="#eclipse-theme-studio" class="eclipse-custom-css-form"><input type="hidden" name="' . $h($tokenName) . '" value="' . $h($token) . '"><header><span class="eclipse-eyebrow">' . $h($customCssEyebrow) . '</span><h3>' . $h($customCssTitle) . '</h3><p>' . $h($customCssIntro) . '</p></header>' . $customCssNoticeHtml . '<label class="eclipse-custom-css-editor"><span>' . $h($customCssLabel) . '</span><textarea name="eclipse_custom_css" id="eclipse-custom-css-editor" rows="22" maxlength="65536" spellcheck="false" aria-describedby="eclipse-custom-css-help">' . $h($customCss) . '</textarea></label><p id="eclipse-custom-css-help" class="eclipse-section-intro">' . $customCssHelp . '</p><div class="eclipse-custom-css-actions"><button type="submit" name="eclipse_custom_css_clear" value="1" class="eclipse-reset">' . $h($customCssClear) . '</button><button type="submit" name="eclipse_custom_css_save" value="1">' . $h($customCssSave) . '</button></div></form></section>';
'''
          text = text.replace(marker, panel + marker, 1)
          functions.write_text(text)

          header = Path('eclipse/header.thtml')
          text = header.read_text()
          old = '''$eclipseCustomCssStudioCssPath = rtrim($_CONF['path_layout'], '/\\\\') . '/css/custom-css-studio.css';
$eclipseCustomCssStudioCssVersion = is_file($eclipseCustomCssStudioCssPath) ? (string) @filemtime($eclipseCustomCssStudioCssPath) : eclipse_theme_version();
$eclipseCustomCssJsPath = rtrim($_CONF['path_layout'], '/\\\\') . '/js/custom-css.js';
$eclipseCustomCssJsVersion = is_file($eclipseCustomCssJsPath) ? (string) @filemtime($eclipseCustomCssJsPath) : eclipse_theme_version();
$eclipseCustomCssValue = function_exists('eclipse_custom_css_read') ? eclipse_custom_css_read() : '';
$eclipseCustomCssNotice = function_exists('eclipse_custom_css_notice') ? eclipse_custom_css_notice() : array();
$eclipseCustomCssJson = json_encode($eclipseCustomCssValue, JSON_HEX_TAG | JSON_HEX_AMP | JSON_HEX_APOS | JSON_HEX_QUOT);
$eclipseCustomCssNoticeJson = json_encode($eclipseCustomCssNotice, JSON_HEX_TAG | JSON_HEX_AMP | JSON_HEX_APOS | JSON_HEX_QUOT);
if ($eclipseCustomCssJson === false) $eclipseCustomCssJson = '\"\"';
if ($eclipseCustomCssNoticeJson === false) $eclipseCustomCssNoticeJson = '{}';
?>
<link rel="stylesheet" href="{layout_url}/css/custom-css-studio.css?v=<?php echo rawurlencode($eclipseCustomCssStudioCssVersion); ?>" media="all"{xhtml}>
<script>window.ECLIPSE_LANG=<?php echo eclipse_lang_js(); ?>;window.ECLIPSE_CUSTOM_CSS=<?php echo $eclipseCustomCssJson; ?>;window.ECLIPSE_CUSTOM_CSS_NOTICE=<?php echo $eclipseCustomCssNoticeJson; ?>;</script>
<script src="{layout_url}/js/admin-i18n.js?v=<?php echo rawurlencode($eclipseAdminI18nVersion); ?>"></script>
<script src="{layout_url}/js/custom-css.js?v=<?php echo rawurlencode($eclipseCustomCssJsVersion); ?>"></script>'''
          new = '''$eclipseCustomCssStudioCssPath = rtrim($_CONF['path_layout'], '/\\\\') . '/css/custom-css-studio.css';
$eclipseCustomCssStudioCssVersion = is_file($eclipseCustomCssStudioCssPath) ? (string) @filemtime($eclipseCustomCssStudioCssPath) : eclipse_theme_version();
?>
<link rel="stylesheet" href="{layout_url}/css/custom-css-studio.css?v=<?php echo rawurlencode($eclipseCustomCssStudioCssVersion); ?>" media="all"{xhtml}>
<script>window.ECLIPSE_LANG=<?php echo eclipse_lang_js(); ?>;</script>
<script src="{layout_url}/js/admin-i18n.js?v=<?php echo rawurlencode($eclipseAdminI18nVersion); ?>"></script>'''
          if old not in text:
              raise SystemExit('Unable to locate Custom CSS JS loader in header')
          header.write_text(text.replace(old, new, 1))
          PY

          rm -f eclipse/js/custom-css.js
          rm -f .github/workflows/integrate-custom-css-tab-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate Custom CSS directly into Theme Studio"

          for attempt in 1 2 3; do
            if git push origin HEAD:develop-1.1.0; then
              exit 0
            fi
            git fetch origin develop-1.1.0
            git rebase origin/develop-1.1.0
          done
          exit 1
