name: Publish Eclipse prerelease

on:
  push:
    tags:
      - "v*-rc*"

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Rebuild integrity manifest
        shell: pwsh
        run: ./quality/build-eclipse-manifest.ps1 -ThemePath ./eclipse

      - name: Verify manifest is committed
        shell: bash
        run: |
          set -euo pipefail
          if ! git diff --exit-code -- eclipse/MANIFEST.json; then
            echo 'eclipse/MANIFEST.json is not synchronized with the tagged theme tree.' >&2
            exit 1
          fi

      - name: Validate Eclipse release contracts
        shell: pwsh
        run: ./quality/validate-eclipse-release.ps1 -ParentThemePath ./quality/fixtures/denim -NodePath (Get-Command node).Source

      - name: Build release archive and checksum
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 ./quality/prepare-eclipse-package.py
          pwsh ./quality/build-eclipse-manifest.ps1 -ThemePath ./.package-stage/eclipse
          (
            cd .package-stage
            zip -r -9 "../eclipse-$version.zip" eclipse -x '*/.DS_Store' '*/Thumbs.db'
          )
          if unzip -Z1 "eclipse-$version.zip" | grep -v '^eclipse/' | grep -q .; then
            echo 'Archive contains entries outside eclipse/ and is not backward compatible.' >&2
            exit 1
          fi
          test -n "$(unzip -p "eclipse-$version.zip" eclipse/ECLIPSE_THEME_PACKAGE.txt)"
          unzip -p "eclipse-$version.zip" eclipse/admin/install.php | grep -q "\$pi_name='__eclipse_theme_package__'"
          sha256sum "eclipse-$version.zip" > "eclipse-$version.zip.sha256"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "eclipse-$version.zip" \
            "eclipse-$version.zip.sha256" \
            --title "Eclipse $version — testing release" \
            --notes-file RELEASE-NOTES.md \
            --prerelease \
            --verify-tag
