name: Publish Eclipse prerelease

on:
  push:
    tags:
      - "v*-rc*"

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate installable theme
        shell: pwsh
        run: ./quality/validate-eclipse.ps1 -ParentThemePath ./quality/fixtures/denim -NodePath (Get-Command node).Source

      - name: Prepare release asset cache keys
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $assetVersion = "$version-${{ github.run_id }}"

          $functionsPath = './eclipse/functions.php'
          $functions = Get-Content -LiteralPath $functionsPath -Raw
          $functions = [regex]::Replace($functions, "\$version\s*=\s*'\?v=[^']*';", "`$version = '?v=$assetVersion';")
          Set-Content -LiteralPath $functionsPath -Value $functions -Encoding utf8NoBOM

          $formsPath = './eclipse/css/forms.css'
          $forms = Get-Content -LiteralPath $formsPath -Raw
          $forms = [regex]::Replace($forms, '@import\s+url\(["'']configuration\.css(?:\?v=[^"'']*)?["'']\);', "@import url(`"configuration.css?v=$assetVersion`");", 1)
          Set-Content -LiteralPath $formsPath -Value $forms -Encoding utf8NoBOM

      - name: Build release archive and checksum
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $archive = "eclipse-$version.zip"
          Compress-Archive -Path ./eclipse -DestinationPath $archive -CompressionLevel Optimal
          (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash + "  " + $archive | Set-Content -Encoding ascii "$archive.sha256"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "eclipse-$version.zip" \
            "eclipse-$version.zip.sha256" \
            --title "Eclipse $version — testing release" \
            --notes-file RELEASE-NOTES.md \
            --prerelease \
            --verify-tag
