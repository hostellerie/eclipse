name: Publish Eclipse prerelease

on:
  push:
    tags:
      - "v*-rc*"

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate installable theme
        shell: pwsh
        run: ./quality/validate-eclipse.ps1 -ParentThemePath ./quality/fixtures/denim -NodePath (Get-Command node).Source

      - name: Prepare release cache refresh
        shell: bash
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          version = os.environ['GITHUB_REF_NAME'].lstrip('v')
          asset_version = version + '-' + os.environ['GITHUB_RUN_ID']
          root = Path('eclipse')

          functions_path = root / 'functions.php'
          functions = functions_path.read_text(encoding='utf-8')
          functions, count = re.subn(
              r"\$version\s*=\s*'\?v=[^']*';",
              "$version = '?v=" + asset_version + "';",
              functions
          )
          if count < 2:
              raise SystemExit('Unable to update all Eclipse asset cache keys')

          refresh_path = root / 'includes' / 'archive-refresh.php'
          refresh_path.write_text(
              "<?php\n"
              "if (!isset($_CONF) || empty($_CONF['path_data'])) { return; }\n"
              "$eclipseBuildId = '" + asset_version + "';\n"
              "$eclipseMarker = rtrim($_CONF['path_data'], '/\\\\') . DIRECTORY_SEPARATOR . 'eclipse-build-id.txt';\n"
              "$eclipsePrevious = @file_get_contents($eclipseMarker);\n"
              "if (trim((string) $eclipsePrevious) !== $eclipseBuildId) {\n"
              "    if (function_exists('CTL_clearCache')) { CTL_clearCache(); }\n"
              "    @file_put_contents($eclipseMarker, $eclipseBuildId . PHP_EOL, LOCK_EX);\n"
              "}\n",
              encoding='utf-8'
          )

          include_line = "require_once __DIR__ . '/includes/archive-refresh.php';"
          if include_line not in functions:
              anchor = "require_once __DIR__ . '/includes/admin-dashboard.php';"
              if anchor not in functions:
                  raise SystemExit('Unable to inject Eclipse archive refresh helper')
              functions = functions.replace(anchor, anchor + "\n" + include_line, 1)
          functions_path.write_text(functions, encoding='utf-8')

          forms_path = root / 'css' / 'forms.css'
          forms = forms_path.read_text(encoding='utf-8')
          forms, count = re.subn(
              r'@import\s+url\(["\']configuration\.css(?:\?v=[^"\']*)?["\']\);',
              '@import url("configuration.css?v=' + asset_version + '");',
              forms,
              count=1
          )
          if count != 1:
              raise SystemExit('Unable to version configuration.css import')
          forms_path.write_text(forms, encoding='utf-8')
          print('Prepared Eclipse release asset version', asset_version)
          PY

      - name: Build release archive and checksum
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          $archive = "eclipse-$version.zip"
          Compress-Archive -Path ./eclipse -DestinationPath $archive -CompressionLevel Optimal
          (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash + "  " + $archive | Set-Content -Encoding ascii "$archive.sha256"

      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            "eclipse-$version.zip" \
            "eclipse-$version.zip.sha256" \
            --title "Eclipse $version — testing release" \
            --notes-file RELEASE-NOTES.md \
            --prerelease \
            --verify-tag
