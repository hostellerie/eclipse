name: Build installable Eclipse archive

on:
  push:
    branches:
      - develop-1.1.0
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: develop-1.1.0

      - name: Read Eclipse version
        id: version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' eclipse/theme.ini)
          if [ -z "$version" ]; then
            echo "Unable to read Eclipse version from eclipse/theme.ini" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Rebuild integrity manifest
        shell: pwsh
        run: ./quality/build-eclipse-manifest.ps1 -ThemePath ./eclipse

      - name: Build installable archive
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          rm -rf dist
          mkdir -p dist
          zip -r -9 "dist/eclipse-$version.zip" eclipse \
            -x '*/.DS_Store' '*/Thumbs.db'

      - name: Commit updated archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f dist

          if git diff --cached --quiet -- dist; then
            echo "Archive is already up to date."
            exit 0
          fi

          version="${{ steps.version.outputs.version }}"
          git commit -m "Build Eclipse $version installable archive"
          git push
