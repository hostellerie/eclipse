name: Build installable Eclipse archive

on:
  push:
    branches:
      - develop-1.1.0
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: develop-1.1.0

      - name: Read Eclipse version
        id: version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' eclipse/theme.ini)
          if [ -z "$version" ]; then
            echo "Unable to read Eclipse version from eclipse/theme.ini" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Prepare archive assets and integrity manifest
        shell: bash
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ['ECLIPSE_VERSION']
          run_id = os.environ['GITHUB_RUN_ID']
          asset_version = version + '-' + run_id
          root = Path('eclipse')

          # Every generated archive gets a unique browser cache key, even when
          # several archives are built with the same Eclipse version number.
          functions_path = root / 'functions.php'
          functions = functions_path.read_text(encoding='utf-8')
          functions, count = re.subn(
              r"\$version\s*=\s*'\?v=[^']*';",
              "$version = '?v=" + asset_version + "';",
              functions
          )
          if count < 2:
              raise SystemExit('Unable to update all Eclipse asset cache keys')
          functions_path.write_text(functions, encoding='utf-8')

          # configuration.css is imported by forms.css, so it needs the same key.
          forms_path = root / 'css' / 'forms.css'
          forms = forms_path.read_text(encoding='utf-8')
          forms, count = re.subn(
              r'@import\s+url\(["\']configuration\.css(?:\?v=[^"\']*)?["\']\);',
              '@import url("configuration.css?v=' + asset_version + '");',
              forms,
              count=1
          )
          if count != 1:
              raise SystemExit('Unable to version configuration.css import')
          forms_path.write_text(forms, encoding='utf-8')

          # Rebuild the manifest after every packaged file has its final content.
          files = {}
          for path in sorted(root.rglob('*')):
              if not path.is_file() or path.name == 'MANIFEST.json':
                  continue
              relative = path.relative_to(root).as_posix()
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              files[relative] = digest

          manifest = {
              'version': version,
              'asset_version': asset_version,
              'algorithm': 'sha256',
              'files': files,
          }
          (root / 'MANIFEST.json').write_text(
              json.dumps(manifest, indent=4, ensure_ascii=False) + '\n',
              encoding='utf-8'
          )
          print('Manifest rebuilt for', len(files), 'files; asset version', asset_version)
          PY
        env:
          ECLIPSE_VERSION: ${{ steps.version.outputs.version }}

      - name: Build installable archive
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          rm -rf dist
          mkdir -p dist
          zip -r -9 "dist/eclipse-$version.zip" eclipse \
            -x '*/.DS_Store' '*/Thumbs.db'

      - name: Commit updated archive
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f dist

          if git diff --cached --quiet -- dist; then
            echo "Archive is already up to date."
            exit 0
          fi

          version="${{ steps.version.outputs.version }}"
          git commit -m "Build Eclipse $version installable archive"
          git push
