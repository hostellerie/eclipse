name: Build installable Eclipse archive

on:
  push:
    branches: [develop-1.5]
    paths:
      - 'eclipse/**'
      - '!eclipse/MANIFEST.json'
      - 'quality/**'
      - '.github/workflows/build-dist.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eclipse-archive-develop-1.5
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
        with:
          ref: develop-1.5
          fetch-depth: 0

      - name: Run fast regressions
        run: |
          set -euo pipefail
          find eclipse -type f \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -n1 php -l
          php quality/menu-navigation-test.php
          php quality/custom-css-test.php
          php quality/theme-studio-restore-test.php
          php quality/theme-cache-test.php
          php quality/search-form-test.php
          php quality/admin-css-test.php
          php quality/profile-settings-test.php
          node --check eclipse/js/theme.js
          node quality/mobile-navigation-test.cjs
          node quality/check-assets.cjs

      - name: Prepare installable theme
        run: |
          set -euo pipefail
          test "$(awk -F '"' '/^version = / {print $2; exit}' eclipse/theme.ini)" = "1.5.0"
          python3 quality/prepare-eclipse-package.py
          test -f .package-stage/eclipse/ECLIPSE_THEME_PACKAGE.txt
          test -f .package-stage/eclipse/admin/install.php
          test -f .package-stage/eclipse/images/tooltips/tooltip.png
          find .package-stage/eclipse -type f \( -name '*.php' -o -name '*.inc' \) -print0 | xargs -0 -n1 php -l
          pwsh quality/build-eclipse-manifest.ps1 -ThemePath ./.package-stage/eclipse
          mkdir -p dist
          (cd .package-stage && zip -q -r -9 ../dist/eclipse-1.5.0.zip eclipse -x '*/.DS_Store' '*/Thumbs.db')
          unzip -t dist/eclipse-1.5.0.zip
          test "$(unzip -Z1 dist/eclipse-1.5.0.zip | cut -d/ -f1 | sort -u)" = "eclipse"
          unzip -Z1 dist/eclipse-1.5.0.zip | grep -Fxq 'eclipse/images/tooltips/tooltip.png'
          test "$(stat -c '%s' dist/eclipse-1.5.0.zip)" -lt 1900000

      - name: Make ZIP downloadable even if git publication fails
        uses: actions/upload-artifact@v4
        with:
          name: eclipse-1.5.0-installable
          path: dist/eclipse-1.5.0.zip
          if-no-files-found: error
          retention-days: 30

      - name: Commit archive to same branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/eclipse-1.5.0.zip
          git add -u dist/
          if git diff --cached --quiet; then
            echo "Archive already published."
            exit 0
          fi
          git commit -m "dist: build Eclipse 1.5.0 installable ZIP [skip ci]"
          git push origin HEAD:develop-1.5
