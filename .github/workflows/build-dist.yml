name: Build installable Eclipse archive

on:
  push:
    branches:
      - develop-1.1.0
    paths-ignore:
      - 'dist/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-dist:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: develop-1.1.0

      - name: Read Eclipse version
        id: version
        shell: bash
        run: |
          version=$(awk -F '"' '/^version = / { print $2; exit }' eclipse/theme.ini)
          if [ -z "$version" ]; then
            echo "Unable to read Eclipse version from eclipse/theme.ini" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Synchronize packaged version metadata
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          version = os.environ['ECLIPSE_VERSION']
          manifest_path = Path('eclipse/MANIFEST.json')
          manifest = json.loads(manifest_path.read_text(encoding='utf-8'))
          manifest['version'] = version
          manifest_path.write_text(json.dumps(manifest, indent=4, ensure_ascii=False) + '\n', encoding='utf-8')

          functions_path = Path('eclipse/functions.php')
          functions = functions_path.read_text(encoding='utf-8')
          functions = functions.replace("$version = '?v=1.0.0';", "$version = '?v=" + version + "';")
          functions_path.write_text(functions, encoding='utf-8')
          PY
        env:
          ECLIPSE_VERSION: ${{ steps.version.outputs.version }}

      - name: Build installable archives
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          rm -rf dist
          mkdir -p dist
          zip -r -9 "dist/eclipse-$version.zip" eclipse \
            -x '*/.DS_Store' '*/Thumbs.db'
          cp "dist/eclipse-$version.zip" dist/eclipse.zip

      - name: Commit updated archives
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/*.zip

          if git diff --cached --quiet -- dist; then
            echo "Archives are already up to date."
            exit 0
          fi

          version="${{ steps.version.outputs.version }}"
          git commit -m "Build Eclipse $version installable archives"
          git push
