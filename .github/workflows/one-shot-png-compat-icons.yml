name: One-shot Geeklog PNG compatibility icons

on:
  push:
    branches:
      - develop-1.1.0
    paths:
      - '.github/workflows/one-shot-png-compat-icons.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop-1.1.0
          fetch-depth: 0

      - name: Restore Geeklog PNG compatibility contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path('eclipse/functions.php')
          text = path.read_text()

          replacements = [
              ("        'image_type'              => 'svg',", "        'image_type'              => 'png',"),
              ("    global $_BLOCK_TEMPLATE, $_CONF, $TEMPLATE_OPTIONS, $_IMAGE_TYPE;", "    global $_BLOCK_TEMPLATE, $_CONF, $TEMPLATE_OPTIONS;"),
              ("    // Geeklog admin helpers build their icon URLs from this global.\n    // Eclipse is SVG-native, so set the image type at theme initialization.\n    $_IMAGE_TYPE = 'svg';\n", ""),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit('Expected Eclipse image compatibility source not found: ' + old.splitlines()[0])
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY

          base='https://raw.githubusercontent.com/Geeklog-Core/geeklog/dd44c01368afad32e16467fd5357af3299c11d3a/public_html/layout/denim/images'
          for icon in edit copy list addchild install deleteitem enabled disabled unavailable warning info; do
            curl --fail --silent --show-error --location "$base/$icon.png" --output "eclipse/images/$icon.png"
          done

          file eclipse/images/{edit,copy,list,addchild,install,deleteitem,enabled,disabled,unavailable,warning,info}.png

      - name: Commit compatibility assets and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-png-compat-icons.yml
          git add eclipse/functions.php eclipse/images/*.png
          git commit -m "Restore Geeklog PNG admin icon compatibility"
          git pull --rebase origin develop-1.1.0
          git push origin develop-1.1.0
