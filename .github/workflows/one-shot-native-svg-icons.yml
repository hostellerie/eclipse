name: One-shot native SVG admin icons

on:
  push:
    branches:
      - develop-1.1.0
    paths:
      - '.github/workflows/one-shot-native-svg-icons.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop-1.1.0
          fetch-depth: 0

      - name: Make SVG the native Geeklog image type
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          functions = Path('eclipse/functions.php')
          text = functions.read_text()
          old = "function theme_init_eclipse()\n{\n    global $_BLOCK_TEMPLATE, $_CONF, $TEMPLATE_OPTIONS;\n    $_CONF['left_blocks_in_footer'] = 1;"
          new = "function theme_init_eclipse()\n{\n    global $_BLOCK_TEMPLATE, $_CONF, $TEMPLATE_OPTIONS, $_IMAGE_TYPE;\n    // Geeklog admin helpers build icon URLs from this global. Set it at the\n    // theme initialization source so Eclipse never inherits Denim's PNG type.\n    $_IMAGE_TYPE = 'svg';\n    $_CONF['left_blocks_in_footer'] = 1;"
          if old not in text:
              raise SystemExit('theme_init_eclipse signature not found')
          functions.write_text(text.replace(old, new, 1))

          theme_js = Path('eclipse/js/theme.js')
          text = theme_js.read_text()
          old = '''    document.querySelectorAll('img[src*=\\"/layout/eclipse/images/\\"]').forEach(function (img) {
        function fallbackToSvg() {
            var src = img.getAttribute('src') || '';
            img.removeEventListener('error', fallbackToSvg);
            if (/\\.png(?:\\?.*)?$/i.test(src)) {
                img.addEventListener('error', function () { img.hidden = true; }, { once: true });
                img.setAttribute('src', src.replace(/\\.png(?=\\?|$)/i, '.svg'));
            } else {
                img.hidden = true;
            }
        }
        img.addEventListener('error', fallbackToSvg);
        if (img.complete && img.naturalWidth === 0) window.setTimeout(fallbackToSvg, 0);
    });

'''
          if old not in text:
              raise SystemExit('legacy PNG-to-SVG fallback block not found')
          theme_js.write_text(text.replace(old, '', 1))
          PY

      - name: Commit native fix and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-native-svg-icons.yml
          git add eclipse/functions.php eclipse/js/theme.js
          git commit -m "Use SVG admin icons at the Geeklog source"
          git pull --rebase origin develop-1.1.0
          git push origin develop-1.1.0
