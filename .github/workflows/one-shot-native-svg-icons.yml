name: One-shot native SVG admin icons

on:
  push:
    branches:
      - develop-1.1.0
    paths:
      - '.github/workflows/one-shot-native-svg-icons.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop-1.1.0
          fetch-depth: 0
      - name: Apply native SVG migration
        run: python quality/one-shot-native-svg-icons.py
      - name: Commit migration and clean temporary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-native-svg-icons.yml quality/one-shot-native-svg-icons.py
          git add eclipse/functions.php eclipse/js/theme.js
          git commit -m "Use SVG admin icons at the Geeklog source"
          git pull --rebase origin develop-1.1.0
          git push origin develop-1.1.0
