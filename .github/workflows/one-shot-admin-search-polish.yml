name: One-shot polished admin search layout

on:
  push:
    branches:
      - develop-1.1.0
    paths:
      - '.github/workflows/one-shot-admin-search-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop-1.1.0
          fetch-depth: 0

      - name: Polish admin list search
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('eclipse/css/admin/admin.css')
          text = path.read_text()
          start_marker = '/* Semantic administration search panel. Structure is defined by admin/lists/searchmenu.thtml. */'
          end_marker = 'body.eclipse-admin-page .eclipse-admin-bar'
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''/* Semantic administration search panel. Structure is defined by admin/lists/searchmenu.thtml. */
body.eclipse-admin-page .eclipse-admin-list-search{display:grid;grid-template-columns:max-content max-content minmax(0,1fr);grid-template-rows:auto auto auto;align-items:center;justify-content:start;gap:.65rem 1.25rem;width:100%;max-width:100%;box-sizing:border-box;margin:.85rem 0 1rem;padding:.9rem 1rem;background:var(--eclipse-admin-surface);border:1px solid var(--eclipse-admin-border);border-radius:calc(var(--eclipse-admin-radius)*.65);box-shadow:0 5px 16px rgba(15,23,42,.035);font-size:.78rem;line-height:1.25}
body.eclipse-admin-page .eclipse-admin-list-search-main{grid-column:1/-1;grid-row:1;display:grid;grid-template-columns:5.25rem minmax(0,1fr);align-items:center;gap:.65rem;min-width:0;width:100%}
body.eclipse-admin-page .eclipse-admin-list-search-label,body.eclipse-admin-page .eclipse-admin-list-filter-primary label,body.eclipse-admin-page .eclipse-admin-list-filter-limit{margin:0;color:var(--eclipse-admin-text);font-size:.78rem;font-weight:700;line-height:1.25}
body.eclipse-admin-page .eclipse-admin-list-search-field{display:grid;grid-template-columns:minmax(12rem,1fr) auto;align-items:stretch;gap:.45rem;min-width:0;width:100%}
body.eclipse-admin-page .eclipse-admin-list-search-field input[type=search]{box-sizing:border-box;width:100%;min-width:0;min-height:2.25rem;height:2.25rem;margin:0;padding:.35rem .6rem;border-radius:.4rem;font:inherit}
body.eclipse-admin-page .eclipse-admin-list-search-field button{box-sizing:border-box;min-width:5.75rem;min-height:2.25rem;height:2.25rem;margin:0;padding:.35rem .75rem;border-radius:.4rem;font-size:.78rem;font-weight:750;line-height:1;white-space:nowrap}
body.eclipse-admin-page .eclipse-admin-list-search-filters,body.eclipse-admin-page .eclipse-admin-list-filter-primary,body.eclipse-admin-page .eclipse-admin-list-search-meta{display:contents}
body.eclipse-admin-page .eclipse-admin-list-filter-primary label:has(select[name=tid]){grid-column:1;grid-row:2;display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap}
body.eclipse-admin-page .eclipse-admin-list-filter-limit{grid-column:2;grid-row:2;display:inline-flex;align-items:center;gap:.5rem;white-space:nowrap}
body.eclipse-admin-page .eclipse-admin-list-filter-primary label:has(input[name=editaccessonly]){grid-column:1;grid-row:3;display:inline-flex;align-items:center;gap:.42rem;white-space:nowrap}
body.eclipse-admin-page .eclipse-admin-list-filter-primary input[type=checkbox]{width:.9rem;height:.9rem;margin:0}
body.eclipse-admin-page .eclipse-admin-list-filter-primary select,body.eclipse-admin-page .eclipse-admin-list-filter-limit select{box-sizing:border-box;field-sizing:content;width:auto;min-width:0;max-width:18rem;min-height:2.15rem;height:2.15rem;margin:0;padding:.3rem 1.8rem .3rem .55rem;border-radius:.4rem;font-size:.78rem;font-weight:600;line-height:1.2}
body.eclipse-admin-page .eclipse-admin-list-filter-primary select[name=tid]{min-width:7.5rem}
body.eclipse-admin-page .eclipse-admin-list-filter-limit select{min-width:4.6rem;max-width:6rem}
body.eclipse-admin-page .eclipse-admin-list-search-status{grid-column:2;grid-row:3;display:inline-flex;align-items:baseline;gap:.3rem;min-width:0;color:var(--eclipse-admin-muted);font-size:.78rem;font-weight:500;white-space:nowrap}
body.eclipse-admin-page .eclipse-admin-list-search-status strong{color:var(--eclipse-admin-text);font-size:.82rem;font-weight:750;font-variant-numeric:tabular-nums}
body.eclipse-admin-page .eclipse-admin-list-search-tools{grid-column:3;grid-row:3;display:flex;justify-self:end;justify-content:flex-end;min-width:0;margin-left:auto}
body.eclipse-admin-page .eclipse-admin-list-search-tools:empty{display:none}
body.eclipse-admin-page .eclipse-admin-list-search-tools .eclipse-filter-tools{margin:0;padding:0;background:transparent;border:0}
@container eclipse-admin-content (max-width:46rem){
  body.eclipse-admin-page .eclipse-admin-list-search{grid-template-columns:max-content minmax(0,1fr);gap:.6rem .9rem}
  body.eclipse-admin-page .eclipse-admin-list-search-main{grid-template-columns:4.75rem minmax(0,1fr)}
  body.eclipse-admin-page .eclipse-admin-list-filter-primary label:has(select[name=tid]){grid-column:1;grid-row:2}
  body.eclipse-admin-page .eclipse-admin-list-filter-limit{grid-column:2;grid-row:2;justify-self:start}
  body.eclipse-admin-page .eclipse-admin-list-filter-primary label:has(input[name=editaccessonly]){grid-column:1;grid-row:3}
  body.eclipse-admin-page .eclipse-admin-list-search-status{grid-column:2;grid-row:3;justify-self:start}
  body.eclipse-admin-page .eclipse-admin-list-search-tools{grid-column:1/-1;grid-row:4;justify-self:end}
}
@container eclipse-admin-content (max-width:32rem){
  body.eclipse-admin-page .eclipse-admin-list-search{grid-template-columns:minmax(0,1fr);align-items:stretch;padding:.8rem}
  body.eclipse-admin-page .eclipse-admin-list-search-main{grid-column:1;grid-template-columns:minmax(0,1fr);gap:.3rem}
  body.eclipse-admin-page .eclipse-admin-list-search-field{grid-template-columns:minmax(0,1fr) auto}
  body.eclipse-admin-page .eclipse-admin-list-filter-primary label:has(select[name=tid]),body.eclipse-admin-page .eclipse-admin-list-filter-limit,body.eclipse-admin-page .eclipse-admin-list-filter-primary label:has(input[name=editaccessonly]),body.eclipse-admin-page .eclipse-admin-list-search-status,body.eclipse-admin-page .eclipse-admin-list-search-tools{grid-column:1;justify-self:start}
  body.eclipse-admin-page .eclipse-admin-list-filter-primary label:has(select[name=tid]){grid-row:2}
  body.eclipse-admin-page .eclipse-admin-list-filter-limit{grid-row:3}
  body.eclipse-admin-page .eclipse-admin-list-filter-primary label:has(input[name=editaccessonly]){grid-row:4}
  body.eclipse-admin-page .eclipse-admin-list-search-status{grid-row:5}
  body.eclipse-admin-page .eclipse-admin-list-search-tools{grid-row:6;margin-left:0}
}
'''
          path.write_text(text[:start] + replacement + text[end:])
          PY

      - name: Commit polished layout and remove workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-admin-search-polish.yml
          git add eclipse/css/admin/admin.css
          git commit -m "Polish admin list search proportions"
          git pull --rebase origin develop-1.1.0
          git push origin develop-1.1.0
