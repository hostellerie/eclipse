name: One-shot polished admin search layout

on:
  push:
    branches:
      - develop-1.1.0
    paths:
      - '.github/workflows/one-shot-admin-search-polish.yml'

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: develop-1.1.0
          fetch-depth: 0
      - name: Polish admin list search
        run: python .github/scripts/polish-admin-search.py
      - name: Commit polished layout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/one-shot-admin-search-polish.yml .github/scripts/polish-admin-search.py
          git add eclipse/css/admin/admin.css
          git commit -m "Polish admin list search proportions"
          git pull --rebase origin develop-1.1.0
          git push origin develop-1.1.0
